[package]
name = "ccp-gui"
version = "0.1.0"
description = "Interfaz de escritorio de ccp: cuentas de Claude por carpeta"
authors = ["Jose Izaguirre"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ccp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
